openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Customer order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Submit a customer order
      description: Creates a new order from the storefront shipping form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"
        "400":
          description: Invalid order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OrderItemInput:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
        productName:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 1
        unitPrice:
          type: number
          minimum: 0
      required:
        - productId
        - productName
        - quantity
        - unitPrice
    ShippingAddress:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 7
        address:
          type: string
          minLength: 5
        city:
          type: string
          minLength: 2
        notes:
          type: ["string", "null"]
      required:
        - fullName
        - phone
        - address
        - city
    OrderInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
        shipping:
          $ref: "#/components/schemas/ShippingAddress"
        subtotal:
          type: number
          minimum: 0
        deliveryFee:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
      required:
        - items
        - shipping
        - subtotal
        - deliveryFee
        - total
    OrderConfirmation:
      type: object
      properties:
        orderNumber:
          type: string
        message:
          type: string
      required:
        - orderNumber
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

